name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow publish Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest already includes the Android SDK (ANDROID_HOME); AGP fetches
      # any missing platform on its own.

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Restore the fixed signing key (see README → "Signing key"), if it's set up.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            echo "Using fixed signing key"
          else
            echo "::warning::KEYSTORE_B64 secret not set – APK is signed with a throwaway debug key and won't install over older builds."
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tv-remote-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk

      # Publish a Release so the TV app can update itself, and so there's a fixed
      # download link: .../releases/latest/download/tv-remote.apk
      # Only builds of the default branch signed with the fixed key are published;
      # a debug-signed APK could never install over the real one.
      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch && hashFiles('release.jks') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk tv-remote.apk
          gh release create "build-$N" tv-remote.apk \
            --title "Build $N" \
            --notes "$(git log -1 --pretty=%B)" \
            --target "$GITHUB_SHA"
          # Keep the 10 newest releases; delete older ones (and their tags).
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
