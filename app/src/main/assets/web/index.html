<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No zoom, and the page fills the screen when added to the iPhone home screen. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Remote">
  <meta name="theme-color" content="#0b0f1e">
  <meta name="format-detection" content="telephone=no">
  <title>Remote</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar: title, connection pill, settings gear. -->
  <header class="topbar">
    <div class="brand">
      <h1>Remote</h1>
      <span id="status" class="pill" data-state="connecting" role="status">Connecting…</span>
    </div>
    <button id="btn-settings" class="icon-btn" type="button" aria-label="Settings" data-icon="gear"></button>
  </header>

  <!-- Reserved for later phases (volume and playback rows). Keep empty for now. -->
  <section id="extras"></section>

  <!-- Shown when the TV's Accessibility service is off. -->
  <div id="a11y-banner" class="banner" hidden>Turn on the Accessibility service on the TV (TV Remote app → settings)</div>

  <!-- Main module: D-pad and 2×2 nav grid in one row, anchored to the lower half. -->
  <main id="module" class="module" data-hand="right">

    <div class="dpad needs-a11y" role="group" aria-label="D-pad">
      <button class="btn arrow d-up" type="button" data-cmd="DPAD_UP" data-repeat="1" aria-label="Up">
        <span class="ico" data-icon="up"></span>
      </button>
      <button class="btn arrow d-left" type="button" data-cmd="DPAD_LEFT" data-repeat="1" aria-label="Left">
        <span class="ico" data-icon="left"></span>
      </button>
      <button class="btn d-ok" type="button" data-cmd="DPAD_CENTER" aria-label="OK">
        <span class="lbl">OK</span>
      </button>
      <button class="btn arrow d-right" type="button" data-cmd="DPAD_RIGHT" data-repeat="1" aria-label="Right">
        <span class="ico" data-icon="right"></span>
      </button>
      <button class="btn arrow d-down" type="button" data-cmd="DPAD_DOWN" data-repeat="1" aria-label="Down">
        <span class="ico" data-icon="down"></span>
      </button>
    </div>

    <div class="nav">
      <button class="btn needs-a11y" type="button" data-cmd="HOME">
        <span class="ico" data-icon="home"></span>
        <span class="lbl">Home</span>
      </button>
      <button class="btn needs-a11y" type="button" data-cmd="BACK">
        <span class="ico" data-icon="back"></span>
        <span class="lbl">Back</span>
      </button>
      <button class="btn needs-a11y" type="button" data-cmd="RECENTS">
        <span class="ico" data-icon="recents"></span>
        <span class="lbl">Recents</span>
      </button>
      <!-- Label and icon follow caps.menu: "Menu" when "menu", otherwise "Search". Both send MENU. -->
      <button id="btn-menu" class="btn" type="button" data-cmd="MENU" aria-label="Menu or search">
        <span id="menu-icon" class="ico" data-icon="search"></span>
        <span id="menu-label" class="lbl">Search</span>
      </button>
    </div>

  </main>

  <!-- Toast for err messages (top of screen, 2 s). -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Pairing overlay: shown when the TV answers auth ok:false. -->
  <div id="pair" class="overlay" role="dialog" aria-modal="true" aria-labelledby="pair-title" hidden>
    <div class="panel">
      <h2 id="pair-title">Pair with your TV</h2>

      <div id="pair-step-start">
        <p class="muted">Press the button, then type the 4-digit code shown on your TV.</p>
        <button id="btn-show-code" class="action primary" type="button">Show code on TV</button>
      </div>

      <div id="pair-step-code" hidden>
        <p class="muted">Enter the code from the TV screen.</p>
        <input id="pair-code" class="code-input" type="text" inputmode="numeric" pattern="[0-9]*"
               autocomplete="one-time-code" maxlength="4" placeholder="····" aria-label="4-digit code">
        <button id="btn-pair" class="action primary" type="button" disabled>Pair</button>
        <p id="pair-countdown" class="muted small"></p>
      </div>

      <p id="pair-error" class="error" role="alert"></p>
    </div>
  </div>

  <!-- Settings sheet. -->
  <div id="settings" class="sheet-wrap" hidden>
    <div id="settings-backdrop" class="backdrop"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="sheet-head">
        <h2 id="settings-title">Settings</h2>
        <button id="btn-settings-close" class="icon-btn" type="button" aria-label="Close" data-icon="close"></button>
      </div>
      <div class="row">
        <span>Left-hand layout (D-pad on the left)</span>
        <button id="opt-hand" class="switch" type="button" role="switch" aria-checked="false" aria-label="Left-hand layout">
          <i></i>
        </button>
      </div>
      <div class="row">
        <span>Click sound</span>
        <button id="opt-sound" class="switch" type="button" role="switch" aria-checked="false" aria-label="Click sound">
          <i></i>
        </button>
      </div>
      <button id="btn-forget" class="action danger" type="button">Forget this TV</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
